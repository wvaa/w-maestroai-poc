appId: ${APP_PACKAGE}
name: "APPSV005 - Consulta de servicio desde widget de favoritos"
tags:
  - smoke
# Dato de prueba por defecto (favorito de pagos ANDA con deuda). Se puede sobrescribir con -e FAV_ALIAS=...
env:
  FAV_ALIAS: "Casa"
---
# Arrange - Preparacion (login independiente por test)
- launchApp:
    stopApp: true
- runFlow:
    file: ../../subflows/login_flow.yaml
    env:
      USER_NAME: ${TEST_USER}
      USER_PASS: ${TEST_PASS}
# El modal "Sesion duplicada" puede aparecer despues del subflow de modales
- extendedWaitUntil:
    visible: "Mis productos|Sesi.n duplicada"
    timeout: 20000
- runFlow:
    when:
      visible: "Sesi.n duplicada"
    commands:
      - tapOn: "Continuar"
- extendedWaitUntil:
    visible: "Mis productos"
    timeout: 20000
# Act + Assert - Consulta del servicio desde el widget de favoritos
- runFlow:
    file: ../../subflows/consulta_serv_widget_flow.yaml
    env:
      FAV_ALIAS: ${FAV_ALIAS}
